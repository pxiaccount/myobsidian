<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" width="100%" height="100%" style="background:#1e1e2e; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#313244" stroke-width="1"/>
    </pattern>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6adc8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid2)" />

  <!-- Origin: x=0 -> svgX=420, y=0 -> svgY=400. Scale: 1 unit = 50px -->
  
  <!-- Axes -->
  <line x1="60" y1="400" x2="780" y2="400" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="420" y1="600" x2="420" y2="50" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="785" y="405" fill="#cdd6f4" font-size="16" font-weight="bold">x</text>
  <text x="425" y="45" fill="#cdd6f4" font-size="16" font-weight="bold">y</text>
  <text x="402" y="420" fill="#a6adc8" font-size="14">0</text>

  <!-- X ticks -->
  <!-- -5 to 5 (svgX = 420 + x*50) -->
  <line x1="170" y1="395" x2="170" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="160" y="420" fill="#a6adc8" font-size="12">-5</text>
  <line x1="220" y1="395" x2="220" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="210" y="420" fill="#a6adc8" font-size="12">-4</text>
  <line x1="270" y1="395" x2="270" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="260" y="420" fill="#a6adc8" font-size="12">-3</text>
  <line x1="320" y1="395" x2="320" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="310" y="420" fill="#a6adc8" font-size="12">-2</text>
  <line x1="370" y1="395" x2="370" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="360" y="420" fill="#a6adc8" font-size="12">-1</text>
  <line x1="470" y1="395" x2="470" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="465" y="420" fill="#a6adc8" font-size="12">1</text>
  <line x1="520" y1="395" x2="520" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="515" y="420" fill="#a6adc8" font-size="12">2</text>
  <line x1="570" y1="395" x2="570" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="565" y="420" fill="#a6adc8" font-size="12">3</text>
  <line x1="620" y1="395" x2="620" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="615" y="420" fill="#a6adc8" font-size="12">4</text>
  <line x1="670" y1="395" x2="670" y2="405" stroke="#a6adc8" stroke-width="1.5"/><text x="665" y="420" fill="#a6adc8" font-size="12">5</text>

  <!-- Y ticks: y -> svgY = 400 - y*50 -->
  <line x1="415" y1="500" x2="425" y2="500" stroke="#a6adc8" stroke-width="1.5"/><text x="395" y="505" fill="#a6adc8" font-size="12">-2</text>
  <line x1="415" y1="450" x2="425" y2="450" stroke="#a6adc8" stroke-width="1.5"/><text x="395" y="455" fill="#a6adc8" font-size="12">-1</text>
  <line x1="415" y1="350" x2="425" y2="350" stroke="#a6adc8" stroke-width="1.5"/><text x="400" y="355" fill="#a6adc8" font-size="12">1</text>
  <line x1="415" y1="300" x2="425" y2="300" stroke="#a6adc8" stroke-width="1.5"/><text x="400" y="305" fill="#a6adc8" font-size="12">2</text>
  <line x1="415" y1="250" x2="425" y2="250" stroke="#a6adc8" stroke-width="1.5"/><text x="400" y="255" fill="#a6adc8" font-size="12">3</text>
  <line x1="415" y1="200" x2="425" y2="200" stroke="#a6adc8" stroke-width="1.5"/><text x="400" y="205" fill="#a6adc8" font-size="12">4</text>
  <line x1="415" y1="150" x2="425" y2="150" stroke="#a6adc8" stroke-width="1.5"/><text x="400" y="155" fill="#a6adc8" font-size="12">5</text>

  <!-- Base Graph: y = |x| (Vertex at (0,0) -> (420, 400)) -->
  <polyline points="145,125 420,400 695,125" fill="none" stroke="#6c7086" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="420" cy="400" r="4" fill="#6c7086"/>
  <text x="360" y="125" fill="#a6adc8" font-size="13">y = |x| (กราฟหลัก)</text>

  <!-- Graph 1: y = |x-1| + 2 (Vertex at (1, 2) -> (470, 300)) -->
  <polyline points="200,30 470,300 740,30" fill="none" stroke="#f38ba8" stroke-width="2"/>
  <circle cx="470" cy="300" r="5" fill="#f38ba8"/>
  <text x="640" y="70" fill="#f38ba8" font-size="13" font-weight="bold">กราฟ 1: (1, 2)</text>

  <!-- Graph 2: y = |x-1| - 2 (Vertex at (1, -2) -> (470, 500)) -->
  <polyline points="180,210 470,500 760,210" fill="none" stroke="#fab387" stroke-width="2"/>
  <circle cx="470" cy="500" r="5" fill="#fab387"/>
  <text x="690" y="180" fill="#fab387" font-size="13" font-weight="bold">กราฟ 2: (1, -2)</text>

  <!-- Graph 3: y = |x+1| - 2 (Vertex at (-1, -2) -> (370, 500)) [CORRECT ANSWER] -->
  <polyline points="80,210 370,500 660,210" fill="none" stroke="#a6e3a1" stroke-width="4"/>
  <circle cx="370" cy="500" r="7" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="2"/>
  <rect x="220" y="525" width="220" height="35" rx="6" fill="#a6e3a1"/>
  <text x="230" y="547" fill="#11111b" font-size="13" font-weight="bold">★ กราฟ 3: y = |x+1|-2 [จุดยอด (-1,-2)]</text>

  <!-- Graph 4: y = |x+1| + 2 (Vertex at (-1, 2) -> (370, 300)) -->
  <polyline points="100,30 370,300 640,30" fill="none" stroke="#cba6f7" stroke-width="2"/>
  <circle cx="370" cy="300" r="5" fill="#cba6f7"/>
  <text x="180" y="100" fill="#cba6f7" font-size="13" font-weight="bold">กราฟ 4: (-1, 2)</text>

  <!-- Translation Vector / Path from (0,0) to (-1, -2) -->
  <path d="M 420 400 L 370 400 L 370 500" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="300" y="385" fill="#89b4fa" font-size="12">เลื่อนซ้าย 1 หน่วย (h=-1)</text>
  <text x="260" y="460" fill="#89b4fa" font-size="12">เลื่อนลง 2 หน่วย (k=-2)</text>
</svg>
