<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" style="background:#1e1e2e; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#313244" stroke-width="1"/>
    </pattern>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6adc8" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Origin: x=0 -> svgX=240, y=0 -> svgY=420. Scale: 1 unit = 70px in X, 35px in Y -->
  
  <!-- Axes -->
  <!-- X Axis: y = 0 -> svgY = 420 -->
  <line x1="60" y1="420" x2="740" y2="420" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Y Axis: x = 0 -> svgX = 240 -->
  <line x1="240" y1="600" x2="240" y2="50" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="745" y="425" fill="#cdd6f4" font-size="16" font-weight="bold">x</text>
  <text x="245" y="45" fill="#cdd6f4" font-size="16" font-weight="bold">y</text>
  <text x="220" y="440" fill="#a6adc8" font-size="14">0</text>

  <!-- X-Ticks & Labels -->
  <!-- x = -1 -> 170 -->
  <line x1="170" y1="415" x2="170" y2="425" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="165" y="442" fill="#a6adc8" font-size="13">-1</text>
  <!-- x = 1 -> 310 -->
  <line x1="310" y1="415" x2="310" y2="425" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="306" y="442" fill="#a6adc8" font-size="13">1</text>
  <!-- x = 2 -> 380 -->
  <line x1="380" y1="415" x2="380" y2="425" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="376" y="442" fill="#a6adc8" font-size="13">2</text>
  <!-- x = 3 -> 450 -->
  <line x1="450" y1="415" x2="450" y2="425" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="446" y="442" fill="#a6adc8" font-size="13">3</text>
  <!-- x = 4 -> 520 -->
  <line x1="520" y1="415" x2="520" y2="425" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="516" y="442" fill="#a6adc8" font-size="13">4</text>
  <!-- x = 5 -> 590 -->
  <line x1="590" y1="415" x2="590" y2="425" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="586" y="442" fill="#a6adc8" font-size="13">5</text>

  <!-- Y-Ticks & Labels -->
  <!-- y = -2 -> 490 -->
  <line x1="235" y1="490" x2="245" y2="490" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="210" y="495" fill="#a6adc8" font-size="13">-2</text>
  <!-- y = 2 -> 350 -->
  <line x1="235" y1="350" x2="245" y2="350" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="218" y="355" fill="#a6adc8" font-size="13">2</text>
  <!-- y = 4 -> 280 -->
  <line x1="235" y1="280" x2="245" y2="280" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="218" y="285" fill="#a6adc8" font-size="13">4</text>
  <!-- y = 6 -> 210 -->
  <line x1="235" y1="210" x2="245" y2="210" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="218" y="215" fill="#a6adc8" font-size="13">6</text>
  <!-- y = 8 -> 140 -->
  <line x1="235" y1="140" x2="245" y2="140" stroke="#a6adc8" stroke-width="1.5"/>
  <text x="218" y="145" fill="#a6adc8" font-size="13">8</text>

  <!-- Axis of Symmetry: x = 2 (svgX = 380) -->
  <line x1="380" y1="80" x2="380" y2="550" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="385" y="100" fill="#f38ba8" font-size="13">แกนสมมาตร x = 2</text>

  <!-- Linear Line: x + 2y = -2 => y = -0.5x - 1 -->
  <!-- At x = -2 (100), y = 0 (420) -->
  <!-- At x = 4 (520), y = -3 (525) -->
  <!-- At x = -3.5 (svgX = -5), y = 0.75 (393.75) -->
  <line x1="80" y1="360" x2="650" y2="560" stroke="#fab387" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="540" y="565" fill="#fab387" font-size="14" font-weight="bold">เส้นตรง: x + 2y = -2</text>

  <!-- Parabola Curve: y = 2x^2 - 8x + 6 -->
  <!-- Sample Points:
       x = -0.3 => y = 8.58 (svgX = 219, svgY = 119)
       x = 0    => y = 6    (svgX = 240, svgY = 210)
       x = 1    => y = 0    (svgX = 310, svgY = 420)
       x = 2    => y = -2   (svgX = 380, svgY = 490) [Vertex]
       x = 3    => y = 0    (svgX = 450, svgY = 420)
       x = 4    => y = 6    (svgX = 520, svgY = 210)
       x = 4.3  => y = 8.58 (svgX = 541, svgY = 119)
  -->
  <path d="M 215 105 Q 380 870 545 105" fill="none" stroke="#89b4fa" stroke-width="3.5" />
  <text x="510" y="95" fill="#89b4fa" font-size="15" font-weight="bold">พาราโบลา: y = 2x² - 8x + 6</text>

  <!-- Key Points & Markers -->

  <!-- Point: (0, 6) y-intercept [The Answer] -->
  <circle cx="240" cy="210" r="7" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="2"/>
  <rect x="255" y="195" width="140" height="28" rx="5" fill="#a6e3a1" />
  <text x="262" y="214" fill="#11111b" font-size="13" font-weight="bold">จุดตัดแกน y: (0, 6) ★</text>

  <!-- Point: (1, 0) x-intercept 1 -->
  <circle cx="310" cy="420" r="6" fill="#89dceb" stroke="#1e1e2e" stroke-width="2"/>
  <text x="265" y="405" fill="#89dceb" font-size="13" font-weight="bold">(1, 0)</text>

  <!-- Point: (3, 0) x-intercept 2 -->
  <circle cx="450" cy="420" r="6" fill="#89dceb" stroke="#1e1e2e" stroke-width="2"/>
  <text x="455" y="405" fill="#89dceb" font-size="13" font-weight="bold">(3, 0)</text>

  <!-- Point: (2, -2) Vertex & Intersection with line -->
  <circle cx="380" cy="490" r="7" fill="#f9e2af" stroke="#1e1e2e" stroke-width="2"/>
  <rect x="310" y="515" width="170" height="42" rx="5" fill="#f9e2af" />
  <text x="320" y="533" fill="#11111b" font-size="12" font-weight="bold">จุดยอด / จุดตัดเส้นตรง</text>
  <text x="365" y="549" fill="#11111b" font-size="12" font-weight="bold">(2, -2)</text>

  <!-- Point: (4, 6) Symmetric Point -->
  <circle cx="520" cy="210" r="5" fill="#cdd6f4" stroke="#1e1e2e" stroke-width="1.5"/>
  <text x="532" y="215" fill="#bac2de" font-size="13">(4, 6)</text>

  <!-- Legend Box -->
  <rect x="40" y="60" width="180" height="100" rx="8" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
  <circle cx="55" cy="82" r="5" fill="#89b4fa"/>
  <text x="68" y="86" fill="#cdd6f4" font-size="12">กราฟพาราโบลาหงาย</text>
  <line x1="50" y1="105" x2="62" y2="105" stroke="#fab387" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="68" y="109" fill="#cdd6f4" font-size="12">เส้นตรง x + 2y = -2</text>
  <circle cx="55" cy="128" r="5" fill="#a6e3a1"/>
  <text x="68" y="132" fill="#a6e3a1" font-size="12" font-weight="bold">คำตอบ: จุดตัดแกน y</text>
  <circle cx="55" cy="148" r="5" fill="#f9e2af"/>
  <text x="68" y="152" fill="#cdd6f4" font-size="12">จุดยอด (Vertex)</text>
</svg>
